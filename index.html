<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeTrack - Pencatat Usia Barang</title>
    
    <!-- Fix Console Warning Tailwind CDN -->
    <script>
        const originalWarn = console.warn;
        console.warn = (...args) => {
            if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
            originalWarn(...args);
        };
    </script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        primaryHover: '#4338ca',
                        surface: { light: '#f3f4f6', dark: '#111827' },
                        card: { light: '#ffffff', dark: '#1f2937' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #000; /* Outer background */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        
        .mobile-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            background-color: #f3f4f6;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .dark .mobile-container { background-color: #111827; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth Transitions */
        .fade-enter { animation: fadeIn 0.3s ease-out forwards; }
        .fade-exit { animation: fadeOut 0.2s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.98); } }

        /* Spinner for background sync */
        .spinner { 
            border: 2px solid rgba(156, 163, 175, 0.3); 
            border-radius: 50%; 
            border-top: 2px solid #4f46e5; 
            width: 16px; height: 16px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Calendar snap */
        .cal-container { scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .cal-day { min-width: 60px; scroll-snap-align: center; }
        
        /* Nav floating effect */
        .nav-fab-wrapper {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-200 antialiased">

    <div class="mobile-container transition-colors duration-300">

             LOGIN PAGE

    <script>
        // ==========================================
        // URL BACKEND APPS SCRIPT (UBAH JIKA PERLU)
        // ==========================================
        const APPSCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8-Kg8qIBKl3ePKeSiP92RrT1JjBU9HfH2jFDevQjYNF0iuum4_BQq4ws5ZmQq3HDGYA/exec';

        // ==========================================
        // SISTEM PENYIMPANAN AMAN (MENCEGAH BLANK SCREEN)
        // ==========================================
        // Jika browser memblokir localStorage (Tracking Prevention), aplikasi tetap hidup menggunakan memory.
        const memoryStorage = {};
        const safeStorage = {
            get: (key) => {
                try { return localStorage.getItem(key) || memoryStorage[key] || null; }
                catch (e) { return memoryStorage[key] || null; }
            },
            set: (key, val) => {
                try { localStorage.setItem(key, val); }
                catch (e) { memoryStorage[key] = val; }
            },
            remove: (key) => {
                try { localStorage.removeItem(key); }
                catch (e) { delete memoryStorage[key]; }
            }
        };

        // State Aplikasi
        let state = {
            email: safeStorage.get('userEmail') || null,
            name: safeStorage.get('userName') || null,
            items: [],
            theme: safeStorage.get('theme') || 'light'
        };

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            setupAuth();
            setupNavigation();
            setupModal();
            updateDateTime();
            setInterval(updateDateTime, 60000); // Update jam tiap menit

            // Routing awal (Cek Login)
            if (state.email) {
                showAppUI();
                loadDataFromServer();
            } else {
                showLoginUI();
            }
        });

        // ==========================================
        // TEMA DAN WAKTU
        // ==========================================
        function initTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (state.theme === 'dark' || (!safeStorage.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
                icon.className = 'ph-fill ph-sun text-xl text-yellow-500';
            } else {
                html.classList.remove('dark');
                icon.className = 'ph-fill ph-moon text-xl text-gray-700';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                state.theme = 'light';
                safeStorage.set('theme', 'light');
                icon.className = 'ph-fill ph-moon text-xl text-gray-700';
            } else {
                html.classList.add('dark');
                state.theme = 'dark';
                safeStorage.set('theme', 'dark');
                icon.className = 'ph-fill ph-sun text-xl text-yellow-500';
            }
        });

        function updateDateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
            const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('currentTime').innerText = timeStr;
            document.getElementById('currentDate').innerText = dateStr;
        }

        // ==========================================
        // AUTENTIKASI & TRANSISI HALAMAN
        // ==========================================
        function setupAuth() {
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const nameInput = document.getElementById('authName').value.trim();
                const emailInput = document.getElementById('authEmail').value.trim().toLowerCase();
                
                if(emailInput) {
                    state.email = emailInput;
                    state.name = nameInput || emailInput.split('@')[0];
                    
                    safeStorage.set('userEmail', state.email);
                    safeStorage.set('userName', state.name);
                    
                    showAppUI();
                    loadDataFromServer();
                }
            });

            document.getElementById('btnLogout').addEventListener('click', () => {
                safeStorage.remove('userEmail');
                safeStorage.remove('userName');
                state.email = null;
                state.name = null;
                state.items = [];
                showLoginUI();
                showToast('Berhasil keluar');
            });
        }

        function showAppUI() {
            // Update Profile texts
            document.getElementById('userNameDisplay').innerText = state.name;
            document.getElementById('profileName').innerText = state.name;
            document.getElementById('profileEmail').innerText = state.email;

            // Transition
            const login = document.getElementById('loginPage');
            const app = document.getElementById('appContainer');
            
            login.classList.add('hidden');
            app.classList.remove('hidden');
            app.classList.add('flex', 'fade-enter');
            setTimeout(() => app.classList.remove('fade-enter'), 300);
            
            // Go to home by default
            switchView('viewHome');
        }

        function showLoginUI() {
            const login = document.getElementById('loginPage');
            const app = document.getElementById('appContainer');
            
            app.classList.add('hidden');
            app.classList.remove('flex');
            login.classList.remove('hidden');
            login.classList.add('fade-enter');
            setTimeout(() => login.classList.remove('fade-enter'), 300);
        }

        // ==========================================
        // NAVIGASI BAWAH (5 MENU)
        // ==========================================
        function setupNavigation() {
            const navBtns = document.querySelectorAll('.nav-btn');
            
            navBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetId = btn.getAttribute('data-target');
                    switchView(targetId);
                    
                    // Update active styling
                    navBtns.forEach(b => {
                        b.classList.remove('text-primary');
                        b.classList.add('text-gray-400', 'dark:text-gray-500');
                        const icon = b.querySelector('.nav-icon');
                        icon.className = icon.className.replace('ph-fill ', 'ph ');
                    });
                    
                    btn.classList.remove('text-gray-400', 'dark:text-gray-500');
                    btn.classList.add('text-primary');
                    const activeIcon = btn.querySelector('.nav-icon');
                    activeIcon.className = activeIcon.className.replace('ph ', 'ph-fill ');
                });
            });
        }

        function switchView(viewId) {
            const views = document.querySelectorAll('.view-section');
            views.forEach(v => {
                if (v.id === viewId) {
                    v.classList.remove('hidden');
                    v.classList.add('fade-enter');
                    setTimeout(() => v.classList.remove('fade-enter'), 300);
                } else {
                    v.classList.add('hidden');
                }
            });
            
            if (viewId === 'viewCalendar') renderCalendar();
        }

        // ==========================================
        // LOGIKA RENDER (CARD & USIA & KALENDER)
        // ==========================================
        function getCategoryEmoji(cat) {
            if(cat.includes('Makanan')) return '🍔';
            if(cat.includes('Otomotif')) return '🏍️';
            if(cat.includes('Elektronik')) return '💻';
            if(cat.includes('Kesehatan')) return '💊';
            if(cat.includes('Dokumen')) return '📄';
            return '📦';
        }

        // FUNGSI UTAMA: MENGHITUNG DAN MERENDER CARD ITEM
        function generateItemCard(item) {
            const start = new Date(item.startDate);
            const now = new Date();
            const diffTime = now - start;
            const diffDays = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
            
            // Format Usia (Lebih Besar & Jelas)
            let ageText = "";
            let ageSub = "";
            if (diffDays === 0) { ageText = "Baru"; ageSub = "Hari ini"; }
            else if (diffDays < 30) { ageText = diffDays; ageSub = "Hari"; }
            else if (diffDays < 365) { 
                ageText = Math.floor(diffDays / 30); ageSub = `Bulan ${diffDays % 30 > 0 ? (diffDays % 30)+' Hr' : ''}`; 
            } else {
                ageText = Math.floor(diffDays / 365); ageSub = `Tahun ${Math.floor((diffDays % 365)/30)} Bln`; 
            }

            const startStr = start.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'2-digit'});
            
            // Progress Bar & Expiry Status
            let progressHtml = '';
            let isUrgent = false;

            if (item.expiryDate) {
                const end = new Date(item.expiryDate);
                end.setHours(23,59,59);
                const daysLeft = Math.ceil((end.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
                
                let statusText = daysLeft > 0 ? `Sisa ${daysLeft} Hari` : `Lewat ${Math.abs(daysLeft)} Hari`;
                if(daysLeft === 0) statusText = "Expired Hari Ini!";

                // Calculate percentage based on start date and end date
                const totalDuration = end.getTime() - start.getTime();
                let percentage = 0;
                if (totalDuration > 0) {
                    percentage = Math.max(0, ((now.getTime() - start.getTime()) / totalDuration) * 100);
                }
                if (now.getTime() >= end.getTime() || daysLeft <= 0) percentage = 100;
                
                // Color Logic
                let barColor = 'bg-green-500';
                let textColor = 'text-green-600 dark:text-green-400';
                let bgBadge = 'bg-green-100 dark:bg-green-900/30';

                if (percentage >= 100 || daysLeft < 0) { 
                    barColor = 'bg-red-500'; textColor = 'text-red-600 dark:text-red-400'; bgBadge = 'bg-red-100 dark:bg-red-900/30';
                    isUrgent = true;
                }
                else if (percentage >= 80 || daysLeft <= 7) { 
                    barColor = 'bg-orange-500'; textColor = 'text-orange-600 dark:text-orange-400'; bgBadge = 'bg-orange-100 dark:bg-orange-900/30';
                    isUrgent = true;
                }

                progressHtml = `
                    <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-800">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Tenggat Waktu</span>
                            <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${bgBadge} ${textColor}">${statusText}</span>
                        </div>
                        <div class="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-2 overflow-hidden">
                            <div class="${barColor} h-2 rounded-full transition-all duration-1000 ease-out" style="width: ${percentage}%"></div>
                        </div>
                    </div>`;
            }

            const cardHTML = `
                <div class="bg-white dark:bg-card-dark rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-800 relative overflow-hidden active:scale-[0.98] transition-transform cursor-pointer" onclick="openModalForEdit('${item.id}')">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-2xl bg-surface-light dark:bg-gray-800 flex items-center justify-center text-2xl shadow-inner">
                                ${getCategoryEmoji(item.category)}
                            </div>
                            <div>
                                <h3 class="font-bold text-lg text-gray-900 dark:text-white leading-tight">${item.name}</h3>
                                <p class="text-[11px] font-medium text-gray-400 mt-0.5">${item.category.split(' ')[0]} ${item.notes ? ' • '+item.notes : ''}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-end justify-between bg-surface-light dark:bg-gray-800/50 p-4 rounded-2xl">
                        <div>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Usia Pemakaian</p>
                            <div class="flex items-baseline gap-1.5">
                                <!-- TEKS USIA DIPERBESAR (FITUR UTAMA) -->
                                <p class="text-4xl sm:text-5xl font-black text-gray-900 dark:text-white leading-none tracking-tighter">${ageText}</p>
                                <p class="text-sm font-bold text-gray-500">${ageSub}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Sejak</p>
                            <p class="text-sm font-bold text-gray-700 dark:text-gray-300">${startStr}</p>
                        </div>
                    </div>
                    ${progressHtml}
                </div>
            `;
            return { html: cardHTML, isUrgent: isUrgent };
        }

        function renderLists() {
            const listFull = document.getElementById('itemsList');
            const listUrgent = document.getElementById('urgentItemsList');
            document.getElementById('totalItemsBadge').innerText = state.items.length;
            
            listFull.innerHTML = '';
            listUrgent.innerHTML = '';
            
            if (!state.items || state.items.length === 0) {
                const emptyHTML = `
                    <div class="text-center py-12 px-6 bg-transparent border-2 border-dashed border-gray-200 dark:border-gray-800 rounded-3xl">
                        <div class="w-16 h-16 mx-auto bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mb-4">
                            <i class="ph ph-archive text-2xl text-gray-400"></i>
                        </div>
                        <h3 class="text-gray-900 dark:text-white font-bold mb-1">Belum Ada Data</h3>
                        <p class="text-gray-500 text-xs">Tekan tombol + di bawah untuk mencatat.</p>
                    </div>`;
                listFull.innerHTML = emptyHTML;
                listUrgent.innerHTML = `<p class="text-xs text-gray-500 text-center italic">Aman terkendali.</p>`;
                return;
            }

            // Sort data: Expired items (with dates) first, then by newest created
            let sortedItems = [...state.items].sort((a, b) => {
                if(a.expiryDate && !b.expiryDate) return -1;
                if(!a.expiryDate && b.expiryDate) return 1;
                if(a.expiryDate && b.expiryDate) return new Date(a.expiryDate) - new Date(b.expiryDate);
                return new Date(b.startDate) - new Date(a.startDate);
            });

            let urgentCount = 0;
            sortedItems.forEach(item => {
                const cardInfo = generateItemCard(item);
                listFull.insertAdjacentHTML('beforeend', cardInfo.html);
                
                if (cardInfo.isUrgent) {
                    listUrgent.insertAdjacentHTML('beforeend', cardInfo.html);
                    urgentCount++;
                }
            });

            if(urgentCount === 0) {
                listUrgent.innerHTML = `
                <div class="bg-green-50 dark:bg-green-900/20 rounded-2xl p-4 border border-green-100 dark:border-green-900/50 flex items-center gap-3">
                    <i class="ph-fill ph-check-circle text-green-500 text-2xl"></i>
                    <div>
                        <p class="text-sm font-bold text-green-800 dark:text-green-400">Semua Kondisi Baik</p>
                        <p class="text-[11px] text-green-600 dark:text-green-500">Belum ada barang yang perlu diganti.</p>
                    </div>
                </div>`;
            }
        }

        function renderCalendar() {
            const container = document.getElementById('calendarContainer');
            container.innerHTML = '';
            
            const now = new Date();
            const year = now.getFullYear(); 
            const month = now.getMonth(); 
            const todayDate = now.getDate();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Collect expiration dates for this month
            const expDays = state.items.filter(i => i.expiryDate).map(i => {
                const d = new Date(i.expiryDate);
                if (d.getFullYear() === year && d.getMonth() === month) return d.getDate();
                return null;
            }).filter(Boolean);

            const daysNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

            for (let i = 1; i <= daysInMonth; i++) {
                const dateObj = new Date(year, month, i);
                const isToday = (i === todayDate);
                const hasAlert = expDays.includes(i);

                let bgClass = isToday 
                    ? 'bg-primary text-white shadow-lg shadow-primary/30 transform scale-110 z-10' 
                    : 'bg-white dark:bg-card-dark text-gray-600 dark:text-gray-300 border border-gray-100 dark:border-gray-800';
                
                let indicatorHTML = '';
                if(hasAlert) {
                    indicatorHTML = `<div class="w-1.5 h-1.5 rounded-full mt-1.5 ${isToday ? 'bg-white' : 'bg-red-500 shadow-[0_0_5px_rgba(239,68,68,0.8)]'}"></div>`;
                } else {
                    indicatorHTML = `<div class="w-1.5 h-1.5 mt-1.5"></div>`; // spacer
                }

                container.insertAdjacentHTML('beforeend', `
                    <div class="cal-day flex flex-col items-center justify-center rounded-[20px] p-3 transition-all ${bgClass}">
                        <span class="text-[10px] font-bold uppercase opacity-80 mb-1 tracking-widest">${daysNames[dateObj.getDay()]}</span>
                        <span class="text-xl font-black leading-none">${i}</span>
                        ${indicatorHTML}
                    </div>
                `);
            }
            
            // Auto scroll ke hari ini
            setTimeout(() => {
                const todayEl = container.querySelector('.bg-primary');
                if(todayEl) container.scrollTo({ left: todayEl.offsetLeft - (container.offsetWidth / 2) + (todayEl.offsetWidth / 2), behavior: 'smooth' });
            }, 300);
        }

        // ==========================================
        // MODAL TAMBAH / EDIT
        // ==========================================
        function setupModal() {
            const modal = document.getElementById('itemModal');
            const content = document.getElementById('itemModalContent');

            document.getElementById('btnOpenAddModal').addEventListener('click', () => {
                document.getElementById('modalTitle').innerText = 'Tambah Catatan Baru';
                document.getElementById('itemId').value = '';
                document.getElementById('btnDeleteItem').classList.add('hidden');
                document.getElementById('itemForm').reset();
                document.getElementById('itemStart').value = new Date().toISOString().split('T')[0];
                
                modal.classList.remove('hidden'); modal.classList.add('flex');
                setTimeout(() => { modal.classList.add('opacity-100'); content.classList.remove('translate-y-full'); }, 10);
            });

            document.getElementById('btnCloseModal').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

            document.getElementById('itemForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('itemId').value;
                const newItem = {
                    id: id || 'temp_' + Date.now().toString(),
                    name: document.getElementById('itemName').value,
                    startDate: document.getElementById('itemStart').value,
                    expiryDate: document.getElementById('itemExpiry').value,
                    category: document.getElementById('itemCategory').value,
                    notes: document.getElementById('itemNotes').value
                };

                // Optimistic UI Update
                if (id) {
                    const index = state.items.findIndex(i => i.id === id);
                    if (index !== -1) state.items[index] = newItem;
                    syncToServer('updateItem', newItem);
                    showToast('Data diperbarui');
                } else {
                    state.items.unshift(newItem); // Tambah di paling atas
                    syncToServer('addItem', newItem);
                    showToast('Data ditambahkan');
                }
                
                closeModal();
                renderLists();
                renderCalendar();
            });

            document.getElementById('btnDeleteItem').addEventListener('click', () => {
                const id = document.getElementById('itemId').value;
                if(id) {
                    state.items = state.items.filter(i => i.id !== id);
                    syncToServer('deleteItem', { id: id });
                    closeModal();
                    renderLists();
                    renderCalendar();
                    showToast('Data dihapus');
                }
            });
        }

        function openModalForEdit(id) {
            const item = state.items.find(i => i.id === id);
            if (!item) return;
            
            document.getElementById('modalTitle').innerText = 'Edit Catatan';
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemStart').value = item.startDate;
            document.getElementById('itemExpiry').value = item.expiryDate || '';
            
            // Match category option explicitly because of emoji prefixes
            const select = document.getElementById('itemCategory');
            Array.from(select.options).forEach(opt => {
                if(opt.value === item.category || opt.text.includes(item.category)) {
                    select.value = opt.value;
                }
            });
            if(!select.value) select.value = 'Lainnya'; // fallback

            document.getElementById('itemNotes').value = item.notes || '';
            document.getElementById('btnDeleteItem').classList.remove('hidden');
            
            const modal = document.getElementById('itemModal');
            const content = document.getElementById('itemModalContent');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.add('opacity-100'); content.classList.remove('translate-y-full'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('itemModal');
            const content = document.getElementById('itemModalContent');
            content.classList.add('translate-y-full'); modal.classList.remove('opacity-100');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }

        // ==========================================
        // KOMUNIKASI SERVER (BACKGROUND SYNC)
        // ==========================================
        function toggleSpinner(show) {
            const spin = document.getElementById('syncIndicator');
            if(show) spin.classList.remove('hidden'); else spin.classList.add('hidden');
        }

        async function loadDataFromServer() {
            if(!state.email) return;
            toggleSpinner(true);
            try {
                const res = await fetch(`${APPSCRIPT_URL}?action=getItems&userEmail=${encodeURIComponent(state.email)}`);
                const json = await res.json();
                if (json && json.status === 'success') {
                    state.items = json.data || [];
                    renderLists();
                    renderCalendar();
                }
            } catch (error) {
                console.error("Gagal load data, menggunakan cache lokal jika ada.", error);
            } finally {
                toggleSpinner(false);
            }
        }

        async function syncToServer(action, payload) {
            toggleSpinner(true);
            try {
                const dataStr = JSON.stringify({
                    action: action, 
                    userEmail: state.email,
                    item: action !== 'deleteItem' ? payload : undefined,
                    itemId: action === 'deleteItem' ? payload.id : undefined
                });
                
                const res = await fetch(APPSCRIPT_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Mode plain text hindari preflight CORS issues
                    body: dataStr 
                });
                
                const json = await res.json();
                
                // Jika itu addItem, server membalas dengan ID permanen (UUID dari spreadsheet).
                // Kita perlu memperbarui ID temp menjadi ID permanen.
                if(action === 'addItem' && json.status === 'success' && json.data && json.data.id) {
                    const tempIndex = state.items.findIndex(i => i.id === payload.id);
                    if(tempIndex !== -1) {
                        state.items[tempIndex].id = json.data.id;
                    }
                }

            } catch (error) {
                console.error("Gagal sync ke server.", error);
            } finally {
                toggleSpinner(false);
            }
        }

        // ==========================================
        // EXPORT DATA (CSV) DAN TOAST
        // ==========================================
        document.getElementById('btnExport').addEventListener('click', () => {
            if(!state.items || state.items.length === 0) return showToast('Belum ada data untuk diexport');
            
            let csv = "data:text/csv;charset=utf-8,Nama Barang,Tgl Mulai Pakai,Tgl Expired/Ganti,Kategori,Catatan\n";
            state.items.forEach(row => {
                let rName = `"${row.name.replace(/"/g, '""')}"`;
                let rNotes = `"${(row.notes||'').replace(/"/g, '""')}"`;
                csv += `${rName},${row.startDate},${row.expiryDate||''},${row.category},${rNotes}\n`;
            });
            
            const encodedUri = encodeURI(csv);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Data_LifeTrack_${state.name}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Data berhasil didownload');
        });

        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
