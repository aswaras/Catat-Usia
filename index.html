<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Konveksi Pro</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:#f8fafc;
}

:root{
    --primary:#2563eb;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.dynamic-theme{
    background:var(--primary);
}

.dynamic-text{
    color:var(--primary);
}

.glass{
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);
}

.nav-bar{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    align-items:center;
    width:100%;
    height:70px;
}

.nav-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#94a3b8;
    font-size:9px;
    font-weight:700;
}

.nav-btn.active{
    color:var(--primary);
}

.center-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.center-fab{
    position:absolute;
    top:-28px;
    width:60px;
    height:60px;
    border-radius:999px;
    background:var(--primary);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    border:4px solid white;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

#mini-loader{
    position:fixed;
    top:16px;
    right:16px;
    z-index:99999;
    display:none;
}

.loader{
    width:42px;
    height:42px;
    border-radius:999px;
    border:4px solid #e2e8f0;
    border-top:4px solid var(--primary);
    animation:spin 1s linear infinite;
    background:white;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body class="pb-28">

<!-- LOADER -->

<div id="mini-loader">
    <div class="loader"></div>
</div>

<!-- INSTALL -->

<div id="install-popup" class="hidden fixed bottom-24 left-4 right-4 bg-white border rounded-3xl p-5 shadow-2xl z-[9999]">
    <div class="flex items-center justify-between">
        <div>
            <h3 class="font-black text-sm">Install App</h3>
            <p class="text-xs text-slate-500">Pasang ke homescreen</p>
        </div>

        <button id="btn-install"
            class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">
            Install
        </button>
    </div>
</div>

<!-- LOGIN -->

<div id="auth-page"
    class="fixed inset-0 bg-slate-100 z-[999999] flex items-center justify-center p-5">

    <div class="bg-white border shadow-xl rounded-[2rem] p-6 w-full max-w-sm">

        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-blue-600 uppercase">
                Konveksi Pro
            </h1>

            <p class="text-[10px] text-slate-400 font-bold tracking-[0.3em] uppercase">
                by meganeura.id
            </p>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-5">

            <button id="tab-login"
                onclick="switchAuth('login')"
                class="bg-blue-600 text-white py-3 rounded-2xl text-xs font-bold uppercase">
                Masuk
            </button>

            <button id="tab-register"
                onclick="switchAuth('register')"
                class="bg-slate-100 text-slate-500 py-3 rounded-2xl text-xs font-bold uppercase">
                Daftar
            </button>

        </div>

        <!-- LOGIN FORM -->

        <div id="login-form">

            <input id="login-email"
                type="email"
                placeholder="Email"
                class="w-full p-4 rounded-2xl bg-slate-50 mb-3 outline-none">

            <input id="login-password"
                type="password"
                placeholder="Password"
                class="w-full p-4 rounded-2xl bg-slate-50 mb-4 outline-none">

            <button onclick="login()"
                class="w-full py-4 rounded-2xl bg-slate-900 text-white text-xs font-bold uppercase">
                Masuk
            </button>

        </div>

        <!-- REGISTER FORM -->

        <div id="register-form" class="hidden">

            <input id="reg-name"
                type="text"
                placeholder="Nama"
                class="w-full p-4 rounded-2xl bg-slate-50 mb-3 outline-none">

            <input id="reg-email"
                type="email"
                placeholder="Email"
                class="w-full p-4 rounded-2xl bg-slate-50 mb-3 outline-none">

            <input id="reg-password"
                type="password"
                placeholder="Password"
                class="w-full p-4 rounded-2xl bg-slate-50 mb-4 outline-none">

            <button onclick="register()"
                class="w-full py-4 rounded-2xl bg-blue-600 text-white text-xs font-bold uppercase">
                Daftar
            </button>

        </div>

    </div>

</div>

<!-- HEADER -->

<header class="sticky top-0 glass border-b px-5 py-4 z-50">

    <div class="flex justify-between items-center">

        <div>
            <h1 class="font-black text-xl dynamic-text uppercase">
                Konveksi Pro
            </h1>

            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.3em]">
                by meganeura.id
            </p>
        </div>

        <button onclick="logout()"
            class="text-[10px] px-4 py-2 bg-red-50 text-red-600 rounded-xl font-bold uppercase">
            Logout
        </button>

    </div>

</header>

<!-- MAIN -->

<main class="max-w-md mx-auto p-4">

    <!-- HOME -->

    <section id="page-home" class="tab-content active space-y-4">

        <div class="grid grid-cols-3 gap-2">

            <div class="bg-white border rounded-3xl p-4 text-center">
                <p class="text-[9px] uppercase text-slate-400 font-bold">
                    Omzet
                </p>

                <h2 id="stat-omzet" class="font-black text-sm mt-1">
                    Rp 0
                </h2>
            </div>

            <div class="bg-white border rounded-3xl p-4 text-center">
                <p class="text-[9px] uppercase text-slate-400 font-bold">
                    Customer
                </p>

                <h2 id="stat-customer" class="font-black text-sm mt-1">
                    0
                </h2>
            </div>

            <div class="bg-white border rounded-3xl p-4 text-center">
                <p class="text-[9px] uppercase text-slate-400 font-bold">
                    Pcs
                </p>

                <h2 id="stat-pcs" class="font-black text-sm mt-1">
                    0
                </h2>
            </div>

        </div>

        <div class="bg-white border rounded-[2rem] p-5">
            <canvas id="chart" height="180"></canvas>
        </div>

    </section>

    <!-- ADD -->

    <section id="page-add" class="tab-content space-y-4">

        <div class="bg-white border rounded-[2rem] p-5 space-y-3">

            <input id="nama"
                type="text"
                placeholder="Nama pelanggan"
                class="w-full p-4 bg-slate-50 rounded-2xl outline-none">

            <input id="deadline"
                type="date"
                class="w-full p-4 bg-slate-50 rounded-2xl outline-none">

            <input id="qty"
                type="number"
                placeholder="Jumlah pcs"
                class="w-full p-4 bg-slate-50 rounded-2xl outline-none">

            <input id="harga"
                type="number"
                placeholder="Harga total"
                class="w-full p-4 bg-slate-50 rounded-2xl outline-none">

            <input id="dp"
                type="number"
                placeholder="DP"
                class="w-full p-4 bg-slate-50 rounded-2xl outline-none">

            <button onclick="saveOrder()"
                class="w-full py-4 rounded-2xl bg-slate-900 text-white text-xs font-bold uppercase">
                Simpan Pesanan
            </button>

        </div>

    </section>

    <!-- LIST -->

    <section id="page-list" class="tab-content">

        <div id="orders" class="space-y-3"></div>

    </section>

</main>

<!-- NAV -->

<nav class="fixed bottom-0 left-0 right-0 glass border-t h-[75px] flex items-center px-4">

    <div class="nav-bar">

        <button onclick="navTo('home')"
            id="nav-home"
            class="nav-btn active">
            Home
        </button>

        <button onclick="navTo('list')"
            id="nav-list"
            class="nav-btn">
            Data
        </button>

        <div class="center-wrapper">

            <button onclick="navTo('add')"
                class="center-fab">
                +
            </button>

        </div>

        <button class="nav-btn">
            Timeline
        </button>

        <button class="nav-btn">
            Setup
        </button>

    </div>

</nav>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyRVnQ0ZTdRcziRxyrWJOkDHNerGj8qiMssSVCeYdbNRqOxDsxQCm2_1agGkkKc7fHLxw/exec";

let db = {
    orders:[]
};

let currentUser = JSON.parse(localStorage.getItem('kp_user')) || null;

let deferredPrompt;

function showLoader(){
    document.getElementById('mini-loader').style.display='block';
}

function hideLoader(){
    document.getElementById('mini-loader').style.display='none';
}

async function api(params={}){

    showLoader();

    try{

        const query = new URLSearchParams(params).toString();

        const res = await fetch(`${API_URL}?${query}`);

        const data = await res.json();

        return data;

    }catch(err){

        console.log(err);

        alert('Koneksi gagal');

        return {
            success:false
        };

    }finally{

        hideLoader();
    }
}

function switchAuth(type){

    document.getElementById('login-form')
        .classList.toggle('hidden', type !== 'login');

    document.getElementById('register-form')
        .classList.toggle('hidden', type !== 'register');
}

async function register(){

    const nama = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;

    const res = await api({
        action:'register',
        nama,
        email,
        password
    });

    if(res.success){

        alert('Register berhasil');

        switchAuth('login');

    }else{

        alert(res.message);
    }
}

async function login(){

    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    const res = await api({
        action:'login',
        email,
        password
    });

    if(res.success){

        currentUser = res.user;

        localStorage.setItem('kp_user', JSON.stringify(currentUser));

        document.getElementById('auth-page')
            .classList.add('hidden');

        loadOrders();

    }else{

        alert(res.message);
    }
}

function logout(){

    localStorage.removeItem('kp_user');

    location.reload();
}

async function loadOrders(){

    const res = await api({
        action:'getOrders',
        user_id:currentUser.id
    });

    if(res.success){

        db.orders = res.orders;

        renderOrders();

        refreshHome();
    }
}

async function saveOrder(){

    const nama = document.getElementById('nama').value;
    const deadline = document.getElementById('deadline').value;
    const qty = Number(document.getElementById('qty').value);
    const total = Number(document.getElementById('harga').value);
    const dp = Number(document.getElementById('dp').value);

    const order = {
        id:Date.now().toString(),
        user_id:currentUser.id,
        nama,
        total,
        dp,
        sisa:total-dp,
        tgl:new Date().toLocaleDateString('id-ID'),
        deadline,
        items:[
            {
                qty
            }
        ]
    };

    const res = await api({
        action:'saveOrder',
        id:order.id,
        user_id:order.user_id,
        nama:order.nama,
        total:order.total,
        dp:order.dp,
        sisa:order.sisa,
        tgl:order.tgl,
        deadline:order.deadline,
        items_json:JSON.stringify(order.items)
    });

    if(res.success){

        db.orders.unshift(order);

        renderOrders();

        refreshHome();

        alert('Pesanan berhasil disimpan');

        navTo('list');
    }
}

async function deleteOrder(id){

    if(!confirm('Hapus pesanan?')) return;

    const res = await api({
        action:'deleteOrder',
        id
    });

    if(res.success){

        db.orders = db.orders.filter(x=>x.id !== id);

        renderOrders();

        refreshHome();
    }
}

function renderOrders(){

    document.getElementById('orders').innerHTML =
        db.orders.map(o=>`

        <div class="bg-white border rounded-[2rem] p-5">

            <div class="flex justify-between items-center mb-3">

                <div>

                    <h3 class="font-black text-sm uppercase">
                        ${o.nama}
                    </h3>

                    <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">
                        ${o.deadline}
                    </p>

                </div>

                <div class="text-right">

                    <h4 class="font-black text-sm text-blue-600">
                        Rp ${format(o.total)}
                    </h4>

                </div>

            </div>

            <div class="flex gap-2">

                <button onclick="deleteOrder('${o.id}')"
                    class="flex-1 py-3 rounded-2xl bg-red-50 text-red-600 text-xs font-bold uppercase">
                    Hapus
                </button>

            </div>

        </div>

    `).join('');
}

function refreshHome(){

    const omzet = db.orders.reduce((a,b)=>a+b.total,0);

    const pcs = db.orders.reduce((a,b)=>a+b.items[0].qty,0);

    document.getElementById('stat-omzet').innerText =
        'Rp ' + format(omzet);

    document.getElementById('stat-customer').innerText =
        db.orders.length;

    document.getElementById('stat-pcs').innerText =
        pcs;

    drawChart();
}

function drawChart(){

    const ctx = document.getElementById('chart');

    if(window.chart){
        window.chart.destroy();
    }

    window.chart = new Chart(ctx,{

        type:'line',

        data:{
            labels:db.orders.map(o=>o.nama),
            datasets:[{
                data:db.orders.map(o=>o.total),
                borderColor:'#2563eb',
                backgroundColor:'rgba(37,99,235,.1)',
                fill:true,
                tension:.4
            }]
        },

        options:{
            plugins:{
                legend:{
                    display:false
                }
            }
        }
    });
}

function navTo(page){

    document.querySelectorAll('.tab-content')
        .forEach(x=>x.classList.remove('active'));

    document.getElementById('page-'+page)
        .classList.add('active');

    document.querySelectorAll('.nav-btn')
        .forEach(x=>x.classList.remove('active'));

    const btn = document.getElementById('nav-'+page);

    if(btn){
        btn.classList.add('active');
    }
}

function format(n){

    return new Intl.NumberFormat('id-ID').format(n || 0);
}

window.addEventListener('beforeinstallprompt',(e)=>{

    e.preventDefault();

    deferredPrompt = e;

    document.getElementById('install-popup')
        .classList.remove('hidden');
});

document.getElementById('btn-install')
.addEventListener('click', async ()=>{

    if(!deferredPrompt) return;

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

    deferredPrompt = null;

    document.getElementById('install-popup')
        .classList.add('hidden');
});

if('serviceWorker' in navigator){

    window.addEventListener('load',()=>{

        navigator.serviceWorker.register('./sw.js');
    });
}

if(currentUser){

    document.getElementById('auth-page')
        .classList.add('hidden');

    loadOrders();
}

</script>

</body>
</html>
